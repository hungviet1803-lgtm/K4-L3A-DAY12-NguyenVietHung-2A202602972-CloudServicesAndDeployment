# CI/CD: mỗi lần push/PR vào main → chạy test + build image trên máy sạch.
# Chỉ khi cả hai xanh VÀ là push lên main thì mới deploy lên Railway.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PUBLIC_URL: https://k4-l3a-day12-nguyenviethung-2a202602972-cloudser-production.up.railway.app

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra badge
      # của chính workflow này → loại khỏi CI. Test có mark docker để job build lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:ci .

      # Chạy thử container: có trả /health 200 không, có chạy bằng non-root không
      - name: Container smoke test
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          test "$(docker exec agent id -u)" != "0"
          docker images day12-agent:ci

      # Số đo cho exercises.md câu 3: Dockerfile 1 stage ban đầu của lab vs bản multi-stage
      - name: Image size — single-stage vs multi-stage
        run: |
          cat > Dockerfile.single <<'EOF'
          FROM python:3.11
          WORKDIR /app
          COPY . .
          RUN pip install -r requirements.txt
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
          docker build -q -f Dockerfile.single -t agent:single .
          docker tag day12-agent:ci agent:multi
          docker images agent --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

      - name: Show logs on failure
        if: failure()
        run: docker logs agent || true

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4

      # RAILWAY_API_TOKEN là Account Token (Railway → Account Settings → Tokens),
      # cất trong GitHub → Settings → Secrets and variables → Actions.
      # Account token không gắn sẵn project nên phải link project/env/service trước.
      - name: railway up
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment production --service "${{ vars.RAILWAY_SERVICE }}"
          railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"

      - name: Smoke test
        run: |
          sleep 45
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
            -H "Content-Type: application/json" -d '{"question":"ci"}')
          test "$code" = "401"
